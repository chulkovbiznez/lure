/* регистрация в 3 шага: старые поля, проверки и отправка остаются, мы только раскладываем их по шагам */
(function(){
  var $=function(i){return document.getElementById(i)};
  var regIn=$('regIn'),reg=$('reg');if(!regIn||!reg||!$('cta')||!$('cont'))return;

      IC_M='<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 7l9 6 9-6"/></svg>';
  function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
  var h3=regIn.querySelector('h3'),mBox=$('mBox');
  var prog=el('div','g-prog','<div class="g-pb"><i id="gPbF"></i></div><div class="g-pl3"><span class="on">О тебе</span><span>Связь</span><span>Старт</span></div>');
  h3.parentNode.insertBefore(prog,mBox);
  var wz=el('div','g-wz'),wzt=el('div','g-wzt');wz.appendChild(wzt);
  var w1=el('div','g-ws','<h4>Как тебя зовут?</h4><p class="g-sub">Так тебя увидит наставник и команда.</p>');
  var w2=el('div','g-ws','<h4>Где тебе написать?</h4><p class="g-sub">Хватит одного контакта. Можно несколько.</p>');
  var w3=el('div','g-ws','<h4>Всё готово</h4><p class="g-sub">Проверь и жми «Начать бесплатно».</p><div class="g-sum" id="gSum"></div>');
  wzt.appendChild(w1);wzt.appendChild(w2);wzt.appendChild(w3);
  mBox.parentNode.insertBefore(wz,mBox.nextSibling);
  function field(id,label,ic){var f=$(id),l=el('label','g-ff',ic);l.appendChild(f);l.appendChild(el('span','',label));l.appendChild(el('em','g-okm'));w1.appendChild(l);return l}
  var lN=field('fN','Имя',IC_U),lF=field('fF','Фамилия',IC_U),lE=field('fE','Почта',IC_M);
  w1.appendChild(el('p','g-note','Сюда придёт код из 6 цифр. Пароль не нужен.'));
  var T=[['T','TG','#2aa3df','Telegram'],['M','M','#7a55ff','MAX'],['W','W','#25d366','WhatsApp'],['P','☎','#9a8f80','Телефон']];
  var tiles=el('div','g-tiles');
  T.forEach(function(t){var b=el('button','g-tl','<i style="--c:'+t[2]+'">'+t[1]+'</i><b>'+t[3]+'</b><em class="g-okm"></em>');b.type='button';b.dataset.k=t[0];tiles.appendChild(b)});
  w2.appendChild(tiles);w2.appendChild($('cont'));
  ['pol'].forEach(function(id){w3.appendChild($(id))});
  var nog=regIn.querySelector('.nog');if(nog)w3.appendChild(nog);
  ['cta','rProg','why','rSt'].forEach(function(id){var e=$(id);if(e)w3.appendChild(e)});
  var msg=el('div','g-msg'),next=el('button','g-next','ДАЛЬШЕ'),back=el('button','g-back','← Назад');next.type=back.type='button';
  wz.parentNode.insertBefore(msg,wz.nextSibling);msg.parentNode.insertBefore(next,msg.nextSibling);next.parentNode.insertBefore(back,next.nextSibling);
  var step=0,sel='T';
  function okN(){return $('fN').value.trim().length>0}function okF(){return $('fF').value.trim().length>0}
  function okE(){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('fE').value.trim())}
  function cOk(k){return ($('v'+k)||{}).textContent==='✓'}function cBad(k){var c=$('ci'+k);return c&&c.classList.contains('err')}
  function marks(){[[lN,'fN',okN],[lF,'fF',okF],[lE,'fE',okE]].forEach(function(x){x[0].classList.toggle('has',!!$(x[1]).value);x[0].classList.toggle('ok',x[2]())});
    [].forEach.call(tiles.children,function(b){var k=b.dataset.k,ci=$('ci'+k);b.classList.toggle('ok',cOk(k));b.classList.toggle('sel',k===sel);if(ci)ci.classList.toggle('g-show',k===sel||!!$('c'+k).value)})}
  ['fN','fF','fE','cT','cM','cW','cP'].forEach(function(id){var f=$(id);['input','change','blur'].forEach(function(ev){f.addEventListener(ev,function(){setTimeout(marks,0);msg.textContent=''})})});
  [].forEach.call(tiles.children,function(b){b.onclick=function(){sel=b.dataset.k;marks();try{$('c'+sel).focus()}catch(e){}}});
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function show(n){step=n;wzt.style.transform='translateX('+(-n*100)+'%)';$('gPbF').style.width=((n+1)/3*100)+'%';
    [].forEach.call(prog.querySelectorAll('.g-pl3 span'),function(x,i){x.classList.toggle('on',i<=n)});
    next.hidden=n===2;back.hidden=n===0;msg.textContent='';
    if(n===2){var c=T.filter(function(t){return cOk(t[0])}).map(function(t){return t[3]});
      $('gSum').innerHTML='<div><span>Имя</span><b>'+esc($('fN').value.trim()+' '+$('fF').value.trim())+'</b></div><div><span>Почта</span><b>'+esc($('fE').value.trim())+'</b></div><div><span>Связь</span><b>'+esc(c.join(', '))+'</b></div>'}
    regIn.scrollTop=0;marks()}
  next.onclick=function(){
    if(step===0){if(!okN()){msg.textContent='Впиши имя';$('fN').focus();return}if(!okF()){msg.textContent='Впиши фамилию';$('fF').focus();return}if(!okE()){msg.textContent='Проверь почту: на неё придёт код';$('fE').focus();return}show(1);return}

  back.onclick=function(){show(step-1)};
  /* каждый раз, когда окно регистрации открывается, начинаем с первого шага */
  try{new MutationObserver(function(){if(!reg.hidden)show(0)}).observe(reg,{attributes:true,attributeFilter:['hidden']})}catch(e){}
  wz.addEventListener('scroll',function(){wz.scrollLeft=0});
  show(0);
})();
</script>
