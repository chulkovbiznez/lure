<script>
/* EAGLES FREE: выход через 30 дней бездействия + ключ входа.
   Свои ключи в телефоне (eaglesfree_*), командный вход EAGLES они не трогают.
   Все запросы к серверу FREE сами получают ключ (обёртка fetch ниже). */
(function(){
  var TTL = 30 * 24 * 60 * 60 * 1000, KEY = 'eaglesfree_last_activity', SKEY = 'eaglesfree_session';
  function has(){ try{ return !!localStorage.getItem('eaglesfree_id'); }catch(e){ return false; } }
  function clearAll(){
    try{
      localStorage.removeItem('eaglesfree_id');
      localStorage.removeItem('eaglesfree_name');
      localStorage.removeItem(KEY);
      localStorage.removeItem(SKEY);
      localStorage.removeItem('eaglesfree_plan');
    }catch(e){}
  }
  window.eaglesFreeClearLogin = clearAll;
  function expired(){
    var last = Number(localStorage.getItem(KEY) || 0);
    return last > 0 && (Date.now() - last) > TTL;
  }
  try{
    if(has() && !localStorage.getItem(SKEY)) clearAll();
    if(has()){
      if(expired()) clearAll();
      else localStorage.setItem(KEY, String(Date.now()));
    }
  }catch(e){}

  if(window.fetch && !window.__egFreeFetchWrapped){
    window.__egFreeFetchWrapped = true;
    var origFetch = window.fetch;
    window.fetch = function(input, init){
      var s = '';
      try{
        if(typeof input === 'string' && input.indexOf('functions.yandexcloud.net/') !== -1){
          s = localStorage.getItem(SKEY) || '';
          if(s){
            if(init && init.body && window.FormData && init.body instanceof FormData){
              init.body.append('sess', s);
            } else {
              input = input + (input.indexOf('?') === -1 ? '?' : '&') + 'sess=' + encodeURIComponent(s);
            }
          }
        }
      }catch(e){}
      var p = origFetch.call(window, input, init);
      if(s){
        p.then(function(r){
          if(!r || r.type === 'opaque') return;
          r.clone().json().then(function(j){
            if(j && j.ok === false && j.error === 'auth'){ clearAll(); location.reload(); }
          }).catch(function(){});
        }).catch(function(){});
      }
      return p;
    };
  }

  var lastWrite = Date.now(), lastCheck = 0;
  function touch(){
    var now = Date.now();
    if(now - lastCheck < 2000) return;
    lastCheck = now;
    try{
      if(!has()) return;
      if(expired()){ clearAll(); location.reload(); return; }
      if(now - lastWrite > 15000){ localStorage.setItem(KEY, String(now)); lastWrite = now; }
    }catch(e){}
  }
  ['pointerdown','touchstart','keydown','scroll','mousemove','wheel'].forEach(function(ev){
    window.addEventListener(ev, touch, { passive:true, capture:true });
  });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ lastCheck = 0; touch(); } });
  setInterval(function(){
    try{ if(has() && expired()){ clearAll(); location.reload(); } }catch(e){}
  }, 60000);
})();
</script>

<script>

  if(EMB) document.documentElement.classList.add('emb');
  function closeAll(){ try{ parent.postMessage({ eg:'chatClose' }, '*'); }catch(e){} }
  function $(id){ return document.getElementById(id); }
  if(!ID){ $('chNoLogin').style.display = 'block'; return; }
  $('chHome').style.display = 'block';

  var ERR = { need_pro:'Писать можно с PRO', blocked:'Человек ограничил переписку с тобой', limit:'На сегодня лимит исчерпан, попробуй завтра',

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function linkify(t){ return esc(t).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]"'])/g, '<a href="$1" target="_blank" rel="noopener nofollow ugc">$1</a>'); }
  function api(p){ var q = Object.keys(p).map(function(k){ return k + '=' + encodeURIComponent(p[k]); }).join('&');
    return fetch(BACKEND_URL + '?' + q + '&_=' + Date.now()).then(function(r){ return r.json(); }); }
  function ini(n){ var p = String(n || '').trim().split(/\s+/); return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase(); }
  function av(x){ return '<span class="ch-av' + (x.pro ? ' pro' : '') + '">' + (x.av ? '<img alt="" src="' + esc(x.av) + '">' : esc(ini(x.name))) + '</span>'; }
  function hm(ms){ var d = new Date(ms); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function day(ms){ var d = new Date(ms), n = new Date(); if(d.toDateString() === n.toDateString()) return 'Сегодня';
    var y = new Date(n - 864e5); if(d.toDateString() === y.toDateString()) return 'Вчера'; return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear(); }

    $('vChats').hidden = $('chFind').hidden = t !== 'chats'; $('vAnn').hidden = t !== 'ann'; if(t === 'ann') loadAnn(); else loadList(); }

  /* ---------- личные ---------- */
  var CAN = false;
  function loadList(){
    return api({ action:'chat_list' }).then(function(r){
      if(!r || !r.ok) return;
      CAN = r.canWrite; var n = 0;
      $('vChats').innerHTML = r.list.length ? r.list.map(function(x){ if(x.unread) n++;
        return '<button type="button" class="ch-item' + (x.unread ? ' un' : '') + '" data-id="' + esc(x.id) + '">' + av(x)
          + '<span class="ch-it"><b>' + esc(x.name) + '</b><small>' + (x.mineLast ? 'Ты: ' : '') + esc(x.last) + '</small></span>'
          + '<span class="ch-tm">' + when(x.at) + '</span>' + (x.unread ? '<span class="ch-dot"></span>' : '') + '</button>'; }).join('')
        : '<div class="ch-empty">Пока нет переписки.<br>Открой <a href="/binar.html">Моя команда</a> → «Структура», нажми на человека и выбери «Познакомиться». Или впиши его ID выше.</div>';
      badge($('nChats'), n);
      Array.prototype.forEach.call($('vChats').querySelectorAll('[data-id]'), function(b){ b.onclick = function(){ openRoom(b.getAttribute('data-id')); }; });
    }).catch(function(){ $('vChats').innerHTML = '<div class="ch-empty">Нет связи с сервером. Обнови страницу.</div>'; });
  }
  /* поиск по ID: сервер сам проверит, можно ли этому человеку писать */
  $('fId').oninput = function(){ this.value = this.value.replace(/\D/g, ''); $('fGo').disabled = this.value.length < 5; };
  $('chFind').onsubmit = function(e){ e.preventDefault(); var id = $('fId').value, b = $('fGo'); if(id.length < 5) return; b.disabled = true;
    api({ action:'chat_open', 'with':id }).then(function(r){ b.disabled = false;
      if(r && r.ok){ $('fId').value = ''; b.disabled = true; openRoom(id); } else toast(r && r.error === 'bad_id' ? 'Человека с ID ' + id + ' нет' : ERR[r && r.error] || 'Не получилось открыть'); })
    .catch(function(){ b.disabled = false; toast('Нет связи с сервером'); }); };
  function counts(){ api({ action:'chat_unread' }).then(function(r){ if(r && r.ok){ badge($('nAnn'), r.ann); } }).catch(function(){}); }

  /* ---------- переписка ---------- */
  var PEER = '', poll = null, lastN = -1;
  function openRoom(id){
    PEER = id; lastN = -1; $('chHome').style.display = 'none'; $('chRoom').classList.add('on'); $('rForm').hidden = true;
    $('rPeer').innerHTML = ''; $('rMsgs').innerHTML = '<div class="ch-empty">Загружаю…</div>';
    try{ history.replaceState(null, '', '?to=' + encodeURIComponent(id) + (EMB ? '&embed=1' : '')); }catch(e){}
    room(true); clearInterval(poll); poll = setInterval(function(){ if(!document.hidden) room(false); }, 8000);
  }
  function closeRoom(){ PEER = ''; clearInterval(poll); $('chRoom').classList.remove('on'); $('rForm').hidden = true; $('chHome').style.display = 'block';
    try{ history.replaceState(null, '', location.pathname + (EMB ? '?embed=1' : '')); }catch(e){} loadList(); counts();
    try{ parent.postMessage({ eg:'chatSeen' }, '*'); }catch(e){} }
  $('rBack').onclick = closeRoom;
  var BLOCKED = false;
  function room(first){
    var id = PEER;
    return api({ action:'chat_open', 'with':id }).then(function(r){
      if(id !== PEER) return;
      if(!r || !r.ok){ $('rMsgs').innerHTML = '<div class="ch-empty">' + esc(ERR[r && r.error] || 'Не получилось открыть') + '</div>'; return; }
      var p = r.peer, pk = (p.pkg || 'free').toLowerCase();
      $('rPeer').innerHTML = av(p) + '<span style="min-width:0"><b>' + esc(p.name) + '</b><small><span class="ch-pk ' + pk + '">' + esc(p.pkg || 'FREE') + '</span>'
        + (p.lv ? '<span class="ch-lv">L' + p.lv + '</span>' : 'ID ' + esc(p.id)) + '</small></span>';
      BLOCKED = r.iBlocked; $('rBlock').textContent = BLOCKED ? 'Разблокировать' : 'Заблокировать';
      if(first || r.msgs.length !== lastN){
        var html = '', d0 = '';
        r.msgs.forEach(function(m){ var dd = day(m.at); if(dd !== d0){ html += '<div class="ch-day">' + dd + '</div>'; d0 = dd; }
          html += '<div class="ch-b' + (m.me ? ' me' : '') + '">' + linkify(m.t) + '<i>' + hm(m.at) + '</i></div>'; });
        $('rMsgs').innerHTML = html || '<div class="ch-empty">' + (r.canWrite ? 'Напиши первое сообщение: представься и расскажи, чем можешь помочь.' : 'Сообщений пока нет.') + '</div>';
        lastN = r.msgs.length; window.scrollTo(0, document.body.scrollHeight);
      }
      var f = $('rForm'); f.hidden = false;
      if(r.blockedMe) f.innerHTML = '<div class="ch-lock">Человек ограничил переписку с тобой.</div>';
      else if(!r.canWrite) f.innerHTML = '<div class="ch-lock"><span>Читать можно всем. Отвечать и писать можно с PRO.</span><a href="/profile.html#planBox">Подключить PRO</a></div>';
      else if(!$('rText')) location.reload();
    }).catch(function(){ if(first) $('rMsgs').innerHTML = '<div class="ch-empty">Нет связи с сервером. Обнови страницу.</div>'; });
  }
  var ta = $('rText');
  ta.oninput = function(){ ta.style.height = 'auto'; ta.style.height = Math.min(140, ta.scrollHeight) + 'px'; $('rSend').disabled = !ta.value.trim(); };
  $('rSend').onclick = function(){
    var t = ta.value.trim(); if(!t || !PEER) return; var b = $('rSend'); b.disabled = true;
    api({ action:'chat_send', 'with':PEER, text:t }).then(function(r){
      if(r && r.ok){ ta.value = ''; ta.oninput(); room(true); } else { toast(ERR[r && r.error] || 'Не отправилось'); b.disabled = false; }
    }).catch(function(){ toast('Нет связи с сервером'); b.disabled = false; });
  };
  $('rMenu').onclick = function(){ $('rSheet').classList.add('on'); };
  $('rCancel').onclick = $('rSheet').onclick = function(e){ if(e.target === this) $('rSheet').classList.remove('on'); };
  $('rBlock').onclick = function(){ $('rSheet').classList.remove('on');
    api({ action:'chat_block', 'with':PEER, on: BLOCKED ? 0 : 1 }).then(function(r){ if(r && r.ok){ BLOCKED = r.block; toast(BLOCKED ? 'Заблокирован: он больше не сможет тебе писать' : 'Разблокирован'); $('rBlock').textContent = BLOCKED ? 'Разблокировать' : 'Заблокировать'; } }); };

  /* ---------- объявления ---------- */
  function loadAnn(){
    return api({ action:'ann_list' }).then(function(r){
      if(!r || !r.ok) return;
      var html = '';
      if(r.team > 0){
        html += '<div class="ch-new"><h3>Объявление команде</h3><div class="ch-note" style="margin:0">Одно сообщение сразу всей твоей личной линии: L1, L2, L3 и дальше, всего ' + r.team + ' чел. Перелив его не получит. Одно объявление в день.</div>'
          + (r.canSend ? '<textarea id="aText" maxlength="1000" placeholder="Например: вебинар в четверг в 20:00, ссылка…"></textarea><button class="ch-btn" type="button" id="aSend" disabled>Отправить ' + r.team + ' чел.</button>'
            : '<div class="ch-lock" style="margin-top:10px"><span>Объявления может отправлять PRO.</span><a href="/profile.html#planBox">Подключить PRO</a></div>') + '</div>';
      }
      html += r.list.length ? r.list.map(function(a){ return '<div class="ch-ann"><div class="w">' + av({ name:a.name, av:a.av, pro:true }) + '<div><b>' + esc(a.name) + '</b><small>' + when(a.at) + '</small></div></div><p>' + linkify(a.t) + '</p></div>'; }).join('')
        : '<div class="ch-empty">Объявлений от твоих пригласивших пока нет.</div>';
      if(r.mine.length) html += '<div class="ch-note" style="margin:18px 2px 8px">Твои объявления</div>' + r.mine.map(function(a){ return '<div class="ch-ann"><div class="w"><div><small>' + when(a.at) + '</small></div></div><p>' + linkify(a.t) + '</p></div>'; }).join('');
      $('vAnn').innerHTML = html; badge($('nAnn'), 0);
      var t = $('aText'), b = $('aSend'), sure = false;
      if(t){ t.oninput = function(){ b.disabled = !t.value.trim(); sure = false; b.classList.remove('sure'); b.textContent = 'Отправить ' + r.team + ' чел.'; };
        b.onclick = function(){
          if(!sure){ sure = true; b.classList.add('sure'); b.textContent = 'Точно отправить всем ' + r.team + ' чел.?'; return; }
          b.disabled = true;
          api({ action:'ann_send', text:t.value.trim() }).then(function(x){ if(x && x.ok){ toast('Отправлено ' + x.team + ' чел.'); loadAnn(); } else { toast(ERR[x && x.error] || 'Не отправилось'); b.disabled = false; } })
            .catch(function(){ toast('Нет связи с сервером'); b.disabled = false; });
        }; }
    }).catch(function(){ $('vAnn').innerHTML = '<div class="ch-empty">Нет связи с сервером. Обнови страницу.</div>'; });
  }

  var to = new URLSearchParams(location.search).get('to'), tab = new URLSearchParams(location.search).get('tab');
  if(to) openRoom(to); else if(tab === 'ann') setTab('ann'); else { loadList(); counts(); }
})();
</script>
