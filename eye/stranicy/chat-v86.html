  rs(); window.addEventListener('resize', rs);

  function fr(){
    cx.clearRect(0, 0, W, H);
    for(var i = 0; i < P.length; i++){ var p = P[i]; p.y -= p.s; p.a += .02; if(p.y < 0){ p.y = 1; p.x = Math.random(); }
      cx.beginPath(); cx.arc(p.x * W + Math.sin(p.a) * 6, p.y * H, p.r, 0, 7); cx.fillStyle = 'rgba(255,214,110,' + (.35 + .35 * Math.sin(p.a)) + ')'; cx.fill(); }

<script>
/* EAGLES FREE: выход через 30 дней бездействия + ключ входа.
   Свои ключи в телефоне (eaglesfree_*), командный вход EAGLES они не трогают.
   Все запросы к серверу FREE сами получают ключ (обёртка fetch ниже). */
(function(){
  var TTL = 30 * 24 * 60 * 60 * 1000, KEY = 'eaglesfree_last_activity', SKEY = 'eaglesfree_session';
  function has(){ try{ return !!localStorage.getItem('eaglesfree_id'); }catch(e){ return false; } }
  function clearAll(){
    try{
      localStorage.removeItem('eaglesfree_id');
      localStorage.removeItem('eaglesfree_name');
      localStorage.removeItem(KEY);
      localStorage.removeItem(SKEY);
      localStorage.removeItem('eaglesfree_plan');
    }catch(e){}
  }
  window.eaglesFreeClearLogin = clearAll;
  function expired(){
    var last = Number(localStorage.getItem(KEY) || 0);
    return last > 0 && (Date.now() - last) > TTL;
  }
  try{
    if(has() && !localStorage.getItem(SKEY)) clearAll();
    if(has()){
      if(expired()) clearAll();
      else localStorage.setItem(KEY, String(Date.now()));
    }
  }catch(e){}

  if(window.fetch && !window.__egFreeFetchWrapped){
    window.__egFreeFetchWrapped = true;
    var origFetch = window.fetch;
    window.fetch = function(input, init){
      var s = '';
      try{
        if(typeof input === 'string' && input.indexOf('functions.yandexcloud.net/') !== -1){
          s = localStorage.getItem(SKEY) || '';
          if(s){
            if(init && init.body && window.FormData && init.body instanceof FormData){
              init.body.append('sess', s);
            } else {
              input = input + (input.indexOf('?') === -1 ? '?' : '&') + 'sess=' + encodeURIComponent(s);
            }
          }
        }
      }catch(e){}
      var p = origFetch.call(window, input, init);
      if(s){
        p.then(function(r){
          if(!r || r.type === 'opaque') return;
          r.clone().json().then(function(j){
            if(j && j.ok === false && j.error === 'auth'){ clearAll(); location.reload(); }
          }).catch(function(){});
        }).catch(function(){});
      }
      return p;
    };
  }

  var lastWrite = Date.now(), lastCheck = 0;
  function touch(){
    var now = Date.now();
    if(now - lastCheck < 2000) return;
    lastCheck = now;
    try{
      if(!has()) return;
      if(expired()){ clearAll(); location.reload(); return; }
      if(now - lastWrite > 15000){ localStorage.setItem(KEY, String(now)); lastWrite = now; }
    }catch(e){}
  }
  ['pointerdown','touchstart','keydown','scroll','mousemove','wheel'].forEach(function(ev){
    window.addEventListener(ev, touch, { passive:true, capture:true });
  });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ lastCheck = 0; touch(); } });
  setInterval(function(){
    try{ if(has() && expired()){ clearAll(); location.reload(); } }catch(e){}
  }, 60000);
})();
</script>

  .ch-find input{ flex:1; min-width:0; height:46px; padding:0 14px; border-radius:14px; border:1px solid #3a3228; background:#141217; color:var(--fg); font:700 16px var(--f); outline:none; }
  .ch-find input:focus{ border-color:var(--gold); }
  .ch-find button{ flex:none; height:46px; padding:0 16px; border:0; border-radius:14px; background:linear-gradient(135deg,#ffd23f,#ff8c28); color:#1a0d04; font:900 14px var(--f) !important; cursor:pointer; }
  .ch-find button:disabled{ opacity:.45; }
  .ch-find[hidden]{ display:none; }
  .ch-btn{ display:block; width:100%; margin-top:10px; height:48px; border:0; border-radius:14px; background:linear-gradient(135deg,#ffd23f,#ff8c28); color:#1a0d04; font:900 15px var(--f); cursor:pointer; }
  .ch-btn:disabled{ opacity:.45; }
  .ch-btn.sure{ background:#ff6a2b; color:#fff; }
  .ch-sheet{ position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.5); display:none; align-items:flex-end; }
  .ch-sheet.on{ display:flex; }
  .ch-sheet .in{ width:100%; max-width:520px; margin:0 auto; padding:14px 16px calc(18px + env(safe-area-inset-bottom)); border-radius:22px 22px 0 0; background:#141217; border:1px solid var(--line); }
  .ch-sheet button{ display:block; width:100%; height:48px; margin-top:8px; border-radius:14px; border:1px solid var(--line); background:#1d1a17; color:var(--fg); font:800 15px var(--f); cursor:pointer; }
  .ch-sheet button.red{ color:#ff8080; border-color:#5a2a2a; }
  .ch-toast{ position:fixed; left:50%; bottom:calc(140px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:99; padding:10px 16px; border-radius:12px; background:#22190e; border:1px solid #e9a23b; color:#ffe08a; font:700 13px var(--f); opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%; text-align:center; }
  .ch-toast.on{ opacity:1; }
  .ch-page .tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:50; display:grid; grid-template-columns:repeat(4,1fr); padding:8px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));
    background:rgba(12,11,13,.86); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); border-top:1px solid #2a2622; }
  .ch-page .tab-item{ position:relative; display:grid; justify-items:center; gap:3px; padding:6px 0; color:#6d675f; font:700 11px var(--f); text-decoration:none; }
  .ch-page .tab-item svg{ width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .ch-page .tab-item.active{ color:#ff6a2b; }
  /* внутри окна в Профиле: без нижней панели, своя кнопка «закрыть» */
  html.emb .ch-page{ padding:14px 14px 20px; min-height:100%; }
  html.emb .ch-page .tabbar{ display:none; }
  html.emb .ch-form{ bottom:0; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); }
  .ch-page .tab-item.active::before{ content:""; position:absolute; top:-8px; left:30%; right:30%; height:3px; border-radius:0 0 3px 3px; background:#ff6a2b; box-shadow:0 0 12px #ff6a2b; }
  /* 16.11.2026: EYE — обычная вкладка: золотое меню из 5 пунктов, как на остальных страницах, без стрелки «назад» */
  .ch-page .tabbar{ grid-template-columns:repeat(5,1fr); background:rgba(10,8,6,.82); border-top:1px solid rgba(255,210,63,.18); }
  .ch-page .tab-item.active{ color:#ffd23f; }
  .ch-page .tab-item.active svg{ transform:translateY(-2px) scale(1.08); }
  .ch-page .tab-item.active::before{ background:#ffd23f; box-shadow:0 0 12px #ffd23f; }
  #hBack{ display:none; }
  .ch-wrap{ position:relative; z-index:1; }
