<style>
  html, body{ overflow-x:hidden; max-width:100%; touch-action:manipulation; }
  .learn-page{
    --bg:#0b0b0d; --card:#16161a; --border:#232328;
    --orange:#ff6a2b; --text:#f4f4f2; --text-dim:#9a9aa2;
    --gold1:#ffe28a; --gold3:#ff9d1a; --gold5:#ff2d00;
    background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,'Segoe UI',sans-serif;
    padding:34px 14px 110px;
    display:flex; justify-content:center;
    min-height:100vh;
  }
  .learn-page *{ box-sizing:border-box; }
  .learn-page .wrap{ width:100%; max-width:480px; min-width:0; }

  .learn-page .gate-overlay{
    position:fixed; inset:0; z-index:100; background:var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .learn-page .gate-card{ display:flex; flex-direction:column; align-items:center; text-align:center; }
  .learn-page .gate-caption{
    font-size:15px; font-weight:800; letter-spacing:.3px; text-transform:uppercase;
    line-height:1.4; margin:0 0 20px;
  }
  .learn-page .gate-login-link{
    display:inline-block; background:var(--orange); color:#1a0d05; font-weight:700;
    padding:12px 22px; border-radius:10px; text-decoration:none; font-size:14px;
  }

  .learn-page .learn-title{ font-size:30px; font-weight:800; letter-spacing:-.4px; margin:0 0 6px; }
  .learn-page .learn-sub{ font-size:12.5px; color:var(--text-dim); margin:0 0 18px; }

  /* ===== Открытый урок ===== */
  .learn-page .hero-lesson{
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    width:100%; aspect-ratio:10/9; min-height:250px;
    padding:18px 16px 18px; margin:0 0 6px;
    border:1.5px solid rgba(255,157,26,.75); border-radius:18px; overflow:hidden; isolation:isolate;
    -webkit-mask-image:-webkit-radial-gradient(white, black);
    background:#000; color:#fff; font-family:inherit; text-align:center; cursor:pointer;
    box-shadow:0 10px 26px rgba(0,0,0,.55), 0 0 22px rgba(255,140,30,.22), inset 0 0 0 1px rgba(255,226,138,.12);
    transform:translateZ(0) scale(1);
    transition:transform .14s ease, box-shadow .14s ease, filter .14s ease;
    -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
    opacity:0; animation:learnApproach 1.2s cubic-bezier(.22,1,.36,1) forwards;
  }
  .learn-page .hero-lesson.pressed{
    transform:scale(.955) translateY(3px);
    box-shadow:0 3px 8px rgba(0,0,0,.6), 0 0 10px rgba(255,140,30,.15), inset 0 6px 18px rgba(0,0,0,.65);
    filter:brightness(.92);
    transition:transform .07s ease, box-shadow .07s ease, filter .07s ease;
  }
  .learn-page .hero-bg{
    position:absolute; inset:0;
    background-image:var(--logo); background-size:84% auto; background-position:center 46px; background-repeat:no-repeat;
  }
  .learn-page .hero-shade{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 58%, rgba(0,0,0,.6) 80%, rgba(0,0,0,.85) 100%);
  }

/* EAGLES FREE: выход через 30 дней бездействия + ключ входа.
   Свои ключи в телефоне (eaglesfree_*), командный вход EAGLES они не трогают.
   Все запросы к серверу FREE сами получают ключ (обёртка fetch ниже). */
(function(){
  var TTL = 30 * 24 * 60 * 60 * 1000, KEY = 'eaglesfree_last_activity', SKEY = 'eaglesfree_session';
  function has(){ try{ return !!localStorage.getItem('eaglesfree_id'); }catch(e){ return false; } }
  function clearAll(){
    try{
      localStorage.removeItem('eaglesfree_id');
      localStorage.removeItem('eaglesfree_name');
      localStorage.removeItem(KEY);
      localStorage.removeItem(SKEY);
      localStorage.removeItem('eaglesfree_plan');
    }catch(e){}
  }
  window.eaglesFreeClearLogin = clearAll;
  function expired(){
    var last = Number(localStorage.getItem(KEY) || 0);
    return last > 0 && (Date.now() - last) > TTL;
  }
  try{
    if(has() && !localStorage.getItem(SKEY)) clearAll();
    if(has()){
      if(expired()) clearAll();
      else localStorage.setItem(KEY, String(Date.now()));
    }
  }catch(e){}

  if(window.fetch && !window.__egFreeFetchWrapped){
    window.__egFreeFetchWrapped = true;
    var origFetch = window.fetch;
    window.fetch = function(input, init){
      var s = '';
      try{
        if(typeof input === 'string' && input.indexOf('functions.yandexcloud.net/') !== -1){
          s = localStorage.getItem(SKEY) || '';
          if(s){
            if(init && init.body && window.FormData && init.body instanceof FormData){
              init.body.append('sess', s);
            } else {
              input = input + (input.indexOf('?') === -1 ? '?' : '&') + 'sess=' + encodeURIComponent(s);
            }
          }
        }
      }catch(e){}
      var p = origFetch.call(window, input, init);
      if(s){
        p.then(function(r){
          if(!r || r.type === 'opaque') return;
          r.clone().json().then(function(j){
            if(j && j.ok === false && j.error === 'auth'){ clearAll(); location.reload(); }
          }).catch(function(){});
        }).catch(function(){});
      }
      return p;
    };
  }

  var lastWrite = Date.now(), lastCheck = 0;
  function touch(){
    var now = Date.now();
    if(now - lastCheck < 2000) return;
    lastCheck = now;
    try{
      if(!has()) return;
      if(expired()){ clearAll(); location.reload(); return; }
      if(now - lastWrite > 15000){ localStorage.setItem(KEY, String(now)); lastWrite = now; }
    }catch(e){}
  }
  ['pointerdown','touchstart','keydown','scroll','mousemove','wheel'].forEach(function(ev){
    window.addEventListener(ev, touch, { passive:true, capture:true });
  });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ lastCheck = 0; touch(); } });
  setInterval(function(){
    try{ if(has() && expired()){ clearAll(); location.reload(); } }catch(e){}
  }, 60000);
})();
</script>

<script>
(function(){
  var actx = null;
  function getCtx(){ if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }
  /* EAGLES 16.11.2026: один мягкий звук нажатий на всех страницах — тёплый короткий «тук» без щелчка */
  function egSoftTap(c){
    var t = c.currentTime + .005, o = c.createOscillator(), o2 = c.createOscillator(), g2 = c.createGain(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(660, t); o.frequency.exponentialRampToValueAtTime(440, t + .09);
    o2.type = 'sine'; o2.frequency.setValueAtTime(990, t); o2.frequency.exponentialRampToValueAtTime(660, t + .09); g2.gain.value = .25;
    f.type = 'lowpass'; f.frequency.value = 2200;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.09, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + .16);
    o.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(c.destination);
    o.start(t); o2.start(t); o.stop(t + .18); o2.stop(t + .18);
  }
  function playClick(){
    try{
      var c = getCtx();
      function fire(){ egSoftTap(c); }
      if(c.state === 'running'){ fire(); } else { c.resume().then(fire).catch(function(){}); }
    }catch(e){}
  }
  document.addEventListener('click', function(ev){
    var el = ev.target.closest('button, a, .list-row, .chk, .link-circle, .tab-btn');
    if(!el) return;
    playClick();
    if(el.tagName === 'A'){
      var hrefAttr = el.getAttribute('href');
      if(hrefAttr && hrefAttr !== '#' && el.target !== '_blank' && !ev.defaultPrevented){
        ev.preventDefault();
        var url = el.href;
        setTimeout(function(){ location.href = url; }, 160);
      }
    }
  });
})();
</script>

  };
  var sv = document.getElementById('egStory'), cur = null, si = 0, tmr = null, t0 = 0, DUR = 5000;
  function show(){
    var s = cur.slides[si];
    document.getElementById('sbars').innerHTML = cur.slides.map(function(_, i){ return '<i><b style="width:' + (i < si ? 100 : 0) + '%"></b></i>'; }).join('');

      + '<button class="stap l" type="button" aria-label="Назад"></button><button class="stap r" type="button" aria-label="Дальше"></button>';
    b.querySelector('.l').onclick = function(){ if(si > 0) si--; show(); };
    b.querySelector('.r').onclick = next;
    cancelAnimationFrame(tmr); t0 = performance.now();
    var bar = document.querySelectorAll('#sbars b')[si];
    (function step(t){ var f = Math.min(1, ((t || performance.now()) - t0) / DUR); bar.style.width = f * 100 + '%'; if(f >= 1) next(); else tmr = requestAnimationFrame(step); })(t0);
  }
  function next(){ if(si < cur.slides.length - 1){ si++; show(); } else close(); }
  function close(){ cancelAnimationFrame(tmr); sv.hidden = true; }
  document.getElementById('sClose').onclick = close;
  document.querySelectorAll('.sto[data-s]').forEach(function(btn){

  });

  window.egToast = function(msg){
    var t = document.createElement('div'); t.className = 'eg-toast'; t.textContent = msg; document.body.appendChild(t);

  };
  document.querySelectorAll('[data-soon]').forEach(function(b){ b.onclick = function(){ egToast('Эти уроки скоро откроются'); }; });
})();
</script>


<script>
/* КС 27.10: красная цифра на «Контакты» — сколько контактов ждут касания сегодня или просрочены */
(function(){
  function run(){try{
    var id=localStorage.getItem('eaglesfree_id');if(!id)return;
    var raw=localStorage.getItem('eaglesfree_kandidaty_'+id)||localStorage.getItem('eaglesfree_moi_kandidaty_v2_'+id);if(!raw)return;
    var st=JSON.parse(raw),c=(st&&st.candidates)||{},d=new Date(),p=function(v){return ('0'+v).slice(-2)},t=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()),n=0;
    for(var k in c){var x=c[k];if(!x||x.locked)continue;var s=String(x.nextTouch||'').trim(),m;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(s)){m=/^(\d{1,2})[.\/-](\d{1,2})(?:[.\/-](\d{2,4}))?$/.exec(s);if(!m)continue;var y=m[3]?+m[3]:d.getFullYear();if(y<100)y+=2000;s=y+'-'+p(m[2])+'-'+p(m[1])}
      if(s<=t)n++}
    var el=null;[].forEach.call(document.querySelectorAll('nav a,nav button,.tabbar a,a.tab-item'),function(a){if(a.textContent.replace(/\d+\+?/g,'').trim()==='Контакты')el=a});
    if(!el)return;var b=el.querySelector('.eg-tdot');

    b.textContent=n>9?'9+':String(n);
  }catch(e){}}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
  setInterval(run,4000);
})();
</script>
